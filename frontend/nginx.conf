# ---------------------------------------------------------------------------
# Nginx configuration for the FleetFlow React SPA
# ---------------------------------------------------------------------------
# Serves the Vite build and reverse-proxies API + WebSocket traffic to the
# FastAPI backend on the Docker network (service name: backend, port 8000).
#
# Browser traffic stays same-origin (port 80/443). That avoids the
# production-breaking pattern of baking http://localhost:8000 into the SPA.
# ---------------------------------------------------------------------------

upstream fleetflow_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- WebSocket tracking ------------------------------------------------
    location /ws/ {
        proxy_pass http://fleetflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- FastAPI routes (no /api prefix in the existing app) ---------------
    location ~ ^/(auth|users|drivers|vehicles|shipments|trips|driver-assignments|driver-attendance|maintenance-alerts|maintenance|fuel-records|analytics|dashboard|reports|audit-logs|health|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://fleetflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ---- Static asset caching ----------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers --------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
