# ---------------------------------------------------------------------------
# Nginx configuration for the FleetFlow React SPA
# ---------------------------------------------------------------------------
# Handles React Router's history API (client-side routing) by falling back
# to index.html for any path that doesn't match a static file.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- Static asset caching ----------------------------------------------
    # Vite outputs hashed filenames (e.g. index-Dh3f8aKz.js) so it is safe
    # to cache them for a long time.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    # All other requests are served the React shell so that React Router
    # can handle the path client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers --------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
