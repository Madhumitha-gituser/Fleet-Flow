# ===========================================================================
# FleetFlow — docker-compose.yml
#
# Public entry: frontend Nginx on port 80 (SPA + reverse proxy to FastAPI).
# Internal: backend → postgres, backend → redis, celery/beat → redis/postgres.
#
# Copy .env.example to .env and fill in secrets before running.
# NEVER commit a .env file containing real secrets.
#
#   docker compose up --build -d
# ===========================================================================

services:

  postgres:
    image: postgres:16-bookworm
    container_name: fleetflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-fleetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host-only bind for local debugging / host-side alembic. Do not publish 0.0.0.0 in production.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetflow} -d ${POSTGRES_DB:-fleetflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-bookworm
    container_name: fleetflow_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetflow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleetflow_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      MAINTENANCE_ALERT_REMINDER_DAYS: ${MAINTENANCE_ALERT_REMINDER_DAYS:-7}
      MAINTENANCE_ALERT_CHECK_INTERVAL_MINUTES: ${MAINTENANCE_ALERT_CHECK_INTERVAL_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-FleetFlow/1.0 (fleet-logistics-app)}
      RUN_MIGRATIONS: "true"
    ports:
      # API docs/debug on the host loopback only. Browsers should use Nginx :80.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetflow_celery_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleetflow_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      MAINTENANCE_ALERT_REMINDER_DAYS: ${MAINTENANCE_ALERT_REMINDER_DAYS:-7}
      MAINTENANCE_ALERT_CHECK_INTERVAL_MINUTES: ${MAINTENANCE_ALERT_CHECK_INTERVAL_MINUTES:-60}
      ORS_API_KEY: ${ORS_API_KEY:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-FleetFlow/1.0 (fleet-logistics-app)}
    command: celery -A app.celery:celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetflow_celery_beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleetflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleetflow_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      MAINTENANCE_ALERT_REMINDER_DAYS: ${MAINTENANCE_ALERT_REMINDER_DAYS:-7}
      MAINTENANCE_ALERT_CHECK_INTERVAL_MINUTES: ${MAINTENANCE_ALERT_CHECK_INTERVAL_MINUTES:-60}
      ORS_API_KEY: ${ORS_API_KEY:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-FleetFlow/1.0 (fleet-logistics-app)}
    command: celery -A app.celery:celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin. Nginx proxies API and WebSocket to backend.
        # Set these only if the API is served on a separate public hostname.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: fleetflow_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
