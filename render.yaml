# FleetFlow API on Render (Web Service).
# Frontend belongs on Vercel; PostgreSQL belongs on Neon.
#
# Dashboard → New → Blueprint → this file, then fill in DATABASE_URL,
# FRONTEND_URL, and CORS_ALLOWED_ORIGINS.

services:
  - type: web
    name: fleetflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: CELERY_BROKER_URL
        value: memory://
      - key: CELERY_RESULT_BACKEND
        value: cache+memory://
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: NOMINATIM_USER_AGENT
        value: FleetFlow/1.0 (fleet-logistics-app)
